name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Static checks
        run: python -m ruff check scripts tests

      - name: Numerical tests
        run: python -m pytest

      - name: Well-conditioned smoke experiment
        run: python scripts/experiment.py --quick --output-root "$RUNNER_TEMP/well-conditioned"

      - name: Ill-conditioned smoke experiment
        run: python scripts/ill_conditioned_experiment.py --quick --output-root "$RUNNER_TEMP/ill-conditioned"
